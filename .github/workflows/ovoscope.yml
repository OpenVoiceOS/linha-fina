name: E2E Tests (ovoscope)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'linha_fina/**'
      - 'test/test_pipeline_ovoscope.py'
      - 'test/end2end/**'
      - '.github/workflows/ovoscope.yml'
  workflow_dispatch:

jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    with:
      install_extras: "test"
      test_path: "test/test_pipeline_ovoscope.py test/end2end/"
      # Validate against the unreleased ovoscope + spec-tools dev branches
      # (needed for the E2EPipelineHarness + INTENT-4 SpecMessage topics used
      # by the consumer e2e tests). Drop this once those release to PyPI.
      pre_release: true
